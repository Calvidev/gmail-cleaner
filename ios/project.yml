# Descripción del proyecto para XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# El repo ya trae `SleeperScore.xcodeproj` generado, así que esto NO hace falta
# para abrir el proyecto. Está aquí por dos razones:
#   1. Se lee mucho mejor que un .pbxproj cuando quieras saber cómo está montado.
#   2. Si algún día el .xcodeproj se estropea, se rehace con:
#        brew install xcodegen && cd ios && xcodegen generate
#
# Ojo: XcodeGen sobrescribe el .xcodeproj entero, incluidos el equipo de firma
# y cualquier cosa que hayas tocado a mano en Xcode.

name: SleeperScore
options:
  bundleIdPrefix: dev.calvi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  SleeperScore:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SleeperScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.calvi.sleeperscore
        INFOPLIST_FILE: SleeperScore/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: SleeperScore/SleeperScore.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - target: ScoreWidgetExtension
        embed: true

  ScoreWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ScoreWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.calvi.sleeperscore.widget
        INFOPLIST_FILE: ScoreWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: ScoreWidget/ScoreWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: "YES"
        ENABLE_PREVIEWS: "YES"
